# Builds the extension zips and attaches them to a GitHub Release.
# Runs when a release is published, or by hand from the Actions tab.
name: Release zips

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v3.0.1"
        required: true

permissions:
  contents: write

jobs:
  zips:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build zips
        run: |
          version=$(jq -r .version manifest.json)
          files="manifest.json popup.html popup.css js icons"
          zip -r -X "weather-report-chrome-v$version.zip" $files
          zip -r -X "weather-report-firefox-v$version.zip" $files
          ls -l *.zip

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" weather-report-*.zip --clobber
